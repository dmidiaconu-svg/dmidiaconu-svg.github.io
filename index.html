<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard KPI</title>

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
}

#dashboard{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
}

#radioBar{
    position:absolute;
    left:15px;
    bottom:15px;
    z-index:999;

    background:rgba(0,0,0,.45);
    backdrop-filter:blur(10px);

    border-radius:30px;

    padding:8px 10px;

    opacity:.70;

    transition:.3s;
}
    
#radioBar:hover{
    opacity:1;
}

#radioBar button{

    background:transparent;

    border:none;

    color:white;

    cursor:pointer;

    font-size:13px;

    padding:6px 10px;

    border-radius:20px;
}

#radioBar button:hover{

    background:rgba(255,255,255,.25);

}

#audio{

    display:none;
    
}
   
</style>

</head>

<body>

<img id="dashboard" src="Slide1.PNG">

<div id="radioBar">

<button onclick="playRadio('https://live7digi.antenaplay.ro/radiozu/radiozu-48000.m3u8')">
ZU
</button>

<button onclick="playRadio('https://live.kissfm.ro/kissfm.aacp')">
KISS
</button>

<button onclick="playRadio('https://live.magicfm.ro/magicfm.aacp')">
MAGIC
</button>
<button onclick="playRadio('https://listen.radioking.com/radio/701141/stream/766385')">
PESCOBAR
</button>
</div>

<audio id="audio" controls></audio>

<script>

function refreshImage(){

    document.getElementById("dashboard").src =
        "Slide1.PNG?t=" + new Date().getTime();

}

setInterval(refreshImage,30000);

const audio=document.getElementById("audio");

function playRadio(url){

    audio.pause();

    audio.src=url;

    audio.load();

    audio.play().catch(function(e){

        console.log(e);

    });

}

// pornește automat Radio ZU la încărcarea paginii
playRadio("https://live7digi.antenaplay.ro/radiozu/radiozu-48000.m3u8");

</script>

</body>
</html>
