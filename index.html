<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard KPI</title>

<style>
html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

#dashboard{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:contain;
}

#audio{
    position:absolute;
    left:10px;
    bottom:10px;
    z-index:100;
}
</style>

</head>

<body>

<img id="dashboard" src="Slide1.PNG" alt="Dashboard">

<audio id="audio" controls autoplay>
    <source src="https://live7digi.antenaplay.ro/radiozu/radiozu-48000.m3u8" type="application/x-mpegURL">
    Browserul tău nu suportă redarea audio.
</audio>

<script>

// Actualizare imagine la fiecare 30 secunde
function refreshImage() {
    document.getElementById("dashboard").src =
        "Slide1.PNG?t=" + new Date().getTime();
}

setInterval(refreshImage, 30000);

// Pornire radio
const audio = document.getElementById("audio");

window.addEventListener("load", () => {
    audio.play().catch(() => {});
});

// Dacă utilizatorul face click, încearcă din nou
document.addEventListener("click", () => {
    audio.play().catch(() => {});
}, { once: true });

// Dacă se oprește, încearcă să repornească
audio.addEventListener("error", () => {
    console.log("Eroare radio. Reîncerc...");
    audio.load();
    audio.play().catch(() => {});
});

audio.addEventListener("stalled", () => {
    console.log("Buffering...");
});

audio.addEventListener("ended", () => {
    console.log("Radio oprit. Repornesc...");
    audio.load();
    audio.play().catch(() => {});
});

</script>

</body>
</html>
