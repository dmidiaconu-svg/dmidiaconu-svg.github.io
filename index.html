<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sample Shop Control Center</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div id="dashboard">

    <!-- ===================================================== -->
    <!-- HEADER -->
    <!-- ===================================================== -->

    <header>

        <div class="logo">

            <div class="company">

                STABILUS

            </div>

            <div class="department">

                ROSO GS-SP • SAMPLE SHOP

            </div>

        </div>

        <div class="title">

            Sample Shop Dashboard

        </div>

        <div class="status">

            <div class="live">

                <span class="live-dot"></span>

                LIVE

            </div>

            <div id="clock">

                --:--:--

            </div>

            <div id="lastRefresh">

                Waiting for data...

            </div>

        </div>

    </header>


    <!-- ===================================================== -->
    <!-- KPI -->
    <!-- ===================================================== -->

    <section id="kpis">

        <div class="kpi-card" id="otdCard">

            <div class="kpi-name">

                OTD

            </div>

            <div class="kpi-value" id="otdValue">

                -- %

            </div>

            <div class="kpi-target">

                Target 85%

            </div>

        </div>


        <div class="kpi-card" id="ltCard">

            <div class="kpi-name">

                LT

            </div>

            <div class="kpi-value" id="ltValue">

                -- Days

            </div>

            <div class="kpi-target">

                Target 14 Days

            </div>

        </div>


        <div class="kpi-card" id="oteCard">

            <div class="kpi-name">

                OTE

            </div>

            <div class="kpi-value" id="oteValue">

                -- %

            </div>

            <div class="kpi-target">

                Target 90%

            </div>

        </div>

    </section>


    <!-- ===================================================== -->
    <!-- CHARTS -->
    <!-- ===================================================== -->

    <section id="charts">

        <div class="chart-box big">

            <div class="chart-title">

                OTD Monthly Performance

            </div>

            <canvas id="chartOTD"></canvas>

        </div>

        <div class="chart-box">

            <div class="chart-title">

                LT Monthly Performance

            </div>

            <canvas id="chartLT"></canvas>

        </div>

        <div class="chart-box">

            <div class="chart-title">

                OTE Monthly Performance

            </div>

            <canvas id="chartOTE"></canvas>

        </div>

    </section>


    <!-- ===================================================== -->
    <!-- FOOTER -->
    <!-- ===================================================== -->

    <footer>

        <div>

            STABILUS Romania

        </div>

        <div>

            FY26

        </div>

        <div>

            Dashboard Version 2.0

        </div>

    </footer>

</div>


<script src="js/config.js"></script>

<script src="js/dashboard.js"></script>

<script src="js/charts.js"></script>

</body>

</html>
