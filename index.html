<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard KPI</title>

<style>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

#dashboard{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:contain;
}

#audio{
    position:absolute;
    bottom:10px;
    left:10px;
    z-index:100;
}
</style>

</head>

<body>

<img id="dashboard" src="Slide1.PNG" alt="Dashboard">

<audio id="audio" controls autoplay></audio>

<script>

// ============================
// Refresh imagine
// ============================

function refreshImage() {
    document.getElementById("dashboard").src =
        "Slide1.PNG?t=" + new Date().getTime();
}

setInterval(refreshImage, 30000);

// ============================
// Radio ZU
// ============================

const audio = document.getElementById("audio");

if (Hls.isSupported()) {

    const hls = new Hls({
        liveSyncDurationCount: 3
    });

    hls.loadSource("https://live7digi.antenaplay.ro/radiozu/radiozu-48000.m3u8");
    hls.attachMedia(audio);

    hls.on(Hls.Events.MANIFEST_PARSED, function () {
        audio.play().catch(() => {});
    });

    audio.addEventListener("error", function () {
        hls.startLoad();
    });

    audio.addEventListener("stalled", function () {
        hls.startLoad();
    });

} else if (audio.canPlayType("application/vnd.apple.mpegurl")) {

    audio.src = "https://live7digi.antenaplay.ro/radiozu/radiozu-48000.m3u8";

    audio.play().catch(() => {});
}

// Dacă utilizatorul dă click, încearcă iar
document.addEventListener("click", function () {
    audio.play().catch(() => {});
}, { once: true });

</script>

</body>
</html>
