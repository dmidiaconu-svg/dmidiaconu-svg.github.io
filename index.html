<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard KPI</title>

<style>
html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

#dashboard{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:contain;
}

#audio{
    position:absolute;
    left:10px;
    bottom:10px;
    z-index:100;
}
</style>

</head>

<body>

<img id="dashboard" src="Slide1.PNG" alt="Dashboard">

<audio id="audio" controls autoplay></audio>

<script>

// Actualizare imagine la fiecare 30 secunde
function refreshImage() {
    document.getElementById("dashboard").src =
        "Slide1.PNG?t=" + new Date().getTime();
}

setInterval(refreshImage, 30000);

// Pornire radio
// ============================
// RADIO
// ============================

const streams = [
    "https://live7digi.antenaplay.ro/radiozu/radiozu-48000.m3u8",
    "https://ivm.antenaplay.ro/liveaudio/radiozu/playlist.m3u8",
    "https://stream.europafm.ro/europafm.aac",
    "https://live.rockfm.ro/rockfm.aac"
];

let currentStream = 0;

const audio = document.getElementById("audio");

function playCurrentStream() {

    console.log("Pornesc:", streams[currentStream]);

    audio.src = streams[currentStream];
    audio.load();

    audio.play().catch(() => {});

}

playCurrentStream();

audio.addEventListener("error", function () {

    currentStream++;

    if (currentStream >= streams.length)
        currentStream = 0;

    console.log("Schimb pe sursa", currentStream + 1);

    playCurrentStream();

});

document.addEventListener("click", function () {
    audio.play().catch(() => {});
}, { once: true });
</script>

</body>
</html>
